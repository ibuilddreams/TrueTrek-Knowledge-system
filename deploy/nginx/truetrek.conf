# TrueTrek Knowledge System — Nginx reverse proxy
# Frontend (Next.js) on 127.0.0.1:3000
# Backend (Gunicorn) on 127.0.0.1:8000

upstream truetrek_backend {
    server 127.0.0.1:8000 fail_timeout=0;
}

upstream truetrek_frontend {
    server 127.0.0.1:3000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.coolnerdz.com test.coolnerdz.com 31.97.146.95 srv1851381.hstgr.cloud;

    client_max_body_size 25M;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # Django static files
    location /static/ {
        alias /opt/TrueTrek-Knowledge-system/backend/staticfiles/;
        expires 7d;
        access_log off;
    }

    # User-uploaded media
    location /media/ {
        alias /opt/TrueTrek-Knowledge-system/backend/media/;
        expires 7d;
        access_log off;

        # Overrides the server-level DENY so lesson PDFs can render in an <iframe>.
        # Location-level add_header replaces (not merges with) the server block's,
        # so the other security headers are repeated here rather than dropped.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;
    }

    # Django admin + API + schema/docs
    location /admin/ {
        proxy_pass http://truetrek_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /api/ {
        proxy_pass http://truetrek_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    # Next.js frontend (everything else)
    location / {
        proxy_pass http://truetrek_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
