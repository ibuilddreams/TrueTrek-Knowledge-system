# TrueTrek Knowledge System — Nginx reverse proxy
# Frontend (Next.js) on 127.0.0.1:3000
# Backend (Gunicorn) on 127.0.0.1:8000

upstream truetrek_backend {
    server 127.0.0.1:8000 fail_timeout=0;
}

upstream truetrek_frontend {
    server 127.0.0.1:3000 fail_timeout=0;
}

# HTTP redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.coolnerdz.com test.coolnerdz.com 31.97.146.95 srv1851381.hstgr.cloud;
    
    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.coolnerdz.com test.coolnerdz.com 31.97.146.95 srv1851381.hstgr.cloud;

    # SSL/TLS Certificate configuration
    ssl_certificate /etc/letsencrypt/live/api.coolnerdz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.coolnerdz.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.coolnerdz.com/chain.pem;

    # SSL/TLS Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    client_max_body_size 25M;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    # Django static files
    location /static/ {
        alias /opt/TrueTrek-Knowledge-system/backend/staticfiles/;
        expires 7d;
        access_log off;
    }

    # User-uploaded media
    location /media/ {
        alias /opt/TrueTrek-Knowledge-system/backend/media/;
        expires 7d;
        access_log off;

        # Overrides the server-level DENY so lesson PDFs can render in an <iframe>.
        # Location-level add_header replaces (not merges with) the server block's,
        # so the other security headers are repeated here rather than dropped.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;
    }

    # Django admin + API + schema/docs
    location /admin/ {
        proxy_pass http://truetrek_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /api/ {
        proxy_pass http://truetrek_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    # Next.js frontend (everything else)
    location / {
        proxy_pass http://truetrek_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
